[package]
name = "nyobarust"
version = "0.1.0"
edition = "2024"

[dependencies]

argon2 = "0.5.3"
password-hash = "0.6.1"
rand = "0.10.2"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"  #[derive(Serialize, Deserialize)]

serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres","chrono", "macros", "uuid"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["serde"] }
rand_core = {version = "0.6.1", features = ["getrandom"]}
validator = { version = "0.21.0", features = ["derive"] }
serde-email = "3.2.0"
mailchecker = "6.0.21"
hickory-resolver = "0.26.1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
hex = { version = "0.4.3", features = ["serde"] }
sha2 = "0.11.0"
jsonwebtoken = "11.0.0"
env = "1.0.1"
